llm_provider: "gemini"
llm_model: "gemini-3.5-flash-lite"
llm_temperature: 0.1  # ignored by gemini-3.5-flash-lite (fixed sampling)
llm_max_tokens: 400
llm_thinking_level: "low"
llm_max_retries: 4  # retries 503 "high demand" / 429 with backoff
embed_model: "BAAI/bge-m3"
embed_batch_size: 16
reranker_enabled: true
reranker_model: "BAAI/bge-reranker-v2-m3"
query_rewrite_enabled: true
chunk_gap_minutes: 30
window_size: 10
window_overlap: 3
max_chunk_tokens: 400
min_chunk_chars: 80
vector_top_k: 20
bm25_top_k: 20
rrf_k: 60
rerank_top_n: 20
final_top_k: 5
min_relevance: -8.0  # raw reranker logit; best score below this -> not found (calibrate in eval)
action_min_confidence: 0.6
timezone: "Asia/Kolkata"
rate_limit_per_min: 10
db_url: "sqlite:///data/app.db"
chroma_dir: "data/chroma_data"
